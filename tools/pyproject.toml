[project]
name = "zint-reference"
version = "0.1.0"
description = "Build-time generator: produces PySCF reference integrals and energies for Zig tests."
requires-python = ">=3.10"
dependencies = [
    "pyscf>=2.5",
    "basis_set_exchange>=0.11",
    "numpy>=1.24",
    "geometric>=1.0",
    "tomli>=2.0; python_version < '3.11'",
]
